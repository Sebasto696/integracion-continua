name: Integración Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Instalar dependencias de Python
        working-directory: app
        run: pip install -r requirements.txt
        
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker de app
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false

      - name: Probar que la app arranca
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://localhost:5000/ > /dev/null
          curl -fsS http://localhost:5000/api/noticias > /dev/null
